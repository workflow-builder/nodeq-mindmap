[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeqmindmap"
version = "2.3.0"
description = "Python port of nodeq-mindmap: MindMapNode data model and ETL pipeline engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mindmap", "etl", "pipeline", "visualization", "career-map"]

[project.urls]
Homepage = "https://github.com/workflow-builder/nodeq-mindmap"
